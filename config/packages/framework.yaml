# Configuration générale du framework Symfony.
framework:
    secret: '%env(APP_SECRET)%'
    # Derrière alwaysdata, seul X-Forwarded-Proto est nécessaire pour reconnaître HTTPS.
    # Aucun proxy n'est approuvé par défaut en local.
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-proto']
    http_method_override: false
    handle_all_throwables: true
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native
    php_errors:
        log: true
    enabled_locales: ['fr', 'en', 'es', 'pt']

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
